version: '3.9'

# Development override — mounts source code for live editing
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  app:
    build:
      context: .
      target: dev
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/var/cache
