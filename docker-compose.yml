version: '3.9'

services:

  # ── MySQL ─────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: paw-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paw_breeders
      MYSQL_USER: paw
      MYSQL_PASSWORD: paw123
    ports:
      - "3306:3306"       # accessible from host for e.g. TablePlus / DBeaver
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "paw", "-ppaw123"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Symfony app (nginx + php-fpm) ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paw-breeders
    ports:
      - "8080:80"
    volumes:
      # Full source code mounted — all files visible on host (incl. vendor after first start)
      - .:/var/www/html
      # Cache stays inside the container (platform-specific compiled files)
      - paw_cache:/var/www/html/var/cache
      # Uploads persist across rebuilds
      - paw_uploads:/var/www/html/public/uploads
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: b3e4f5a6c7d8e9f0a1b2c3d4e5f6a7b8
      DATABASE_URL: "mysql://paw:paw123@db:3306/paw_breeders?serverVersion=8.0.32&charset=utf8mb4"
      # Used by entrypoint.sh to health-check MySQL before running migrations
      MYSQL_HOST: db
      MYSQL_USER: paw
      MYSQL_PASSWORD: paw123
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  paw_cache:
  paw_uploads:
